<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Breakfast, Lunch, Dinner & Snacks</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap');

:root{
  --ink:#1d2b3a;
  --ink-soft:#4f6478;
  --parchment:#ffffff;
  --parchment-dim:#4f6478;
  --tomato:#c65a4e;
  --basil:#5c8a68;
  --aubergine:#7a6a9c;
  --wheat:#d4a537;
  --beige:#e9dfc8;
  --beige-deep:#cbb98c;
  --sky:#eaf3fb;
  --sky-mid:#bcdcf2;
  --sky-deep:#5b8fc4;
  --line: rgba(29,43,58,0.15);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--sky);
  color:var(--ink);
  font-family:'Space Grotesk', Arial, sans-serif;
  font-weight:500;
  min-height:100vh;
  position:relative;
}

.bg-skyline{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  filter:blur(9px);
  transform:scale(1.08);
}
.bg-skyline svg{
  width:100%;
  height:100%;
}
.bg-overlay{
  position:fixed;
  inset:0;
  z-index:1;
  background:rgba(255,255,255,0.45);
}

.wrap{
  display:flex;
  min-height:100vh;
  position:relative;
  z-index:2;
}

/* Sidebar */
.sidebar{
  width:280px;
  flex-shrink:0;
  border-right:3px solid var(--beige-deep);
  padding:32px 20px;
  display:flex;
  flex-direction:column;
  background:rgba(233,223,200,0.5);
  backdrop-filter:blur(6px);
  color:var(--ink);
}

.brand{
  font-family:'Playfair Display', serif;
  font-weight:700;
  font-style:italic;
  font-size:1.7rem;
  letter-spacing:0.01em;
  margin:0 0 2px 0;
  color:var(--sky-deep);
}
.brand-sub{
  font-family:'Caveat', cursive;
  font-size:1.25rem;
  color:var(--ink-soft);
  font-weight:600;
  margin:0 0 28px 0;
}

.meal-toggle{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:22px;
  background:var(--beige);
  padding:4px;
  border-radius:10px;
}
.meal-toggle button{
  padding:10px 6px;
  border:none;
  background:transparent;
  color:var(--ink);
  font-family:'Space Grotesk',sans-serif;
  font-size:0.85rem;
  font-weight:600;
  border-radius:7px;
  cursor:pointer;
  transition:background .25s ease, color .25s ease;
}
.meal-toggle button.active{
  background:var(--sky-deep);
  color:#ffffff;
}

.option-list{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow-y:auto;
}

.option-item{
  padding:13px 12px;
  border-radius:8px;
  cursor:pointer;
  border:1px solid transparent;
  transition:background .2s ease, border-color .2s ease;
}
.option-item:hover{
  background:rgba(91,143,196,0.08);
}
.option-item.selected{
  background:rgba(203,185,140,0.28);
  border-color:rgba(203,185,140,0.7);
}
.option-item .name{
  font-family:'Playfair Display', serif;
  font-size:1.14rem;
  font-weight:600;
  color:var(--ink);
}
.option-item .meta{
  font-size:0.85rem;
  color:var(--ink-soft);
  font-weight:500;
  margin-top:3px;
}

.sidebar-foot{
  margin-top:auto;
  padding-top:20px;
  font-size:0.82rem;
  color:var(--ink-soft);
  font-weight:500;
  line-height:1.55;
}

/* Main */
.main{
  flex:1;
  padding:56px 64px;
  overflow-y:auto;
  background:rgba(253,250,242,0.68);
  backdrop-filter:blur(6px);
}
.recipe-card{
  max-width:620px;
}
.recipe-kicker{
  font-family:'Caveat', cursive;
  font-size:1.5rem;
  color:var(--sky-deep);
  font-weight:700;
  margin-bottom:2px;
}
.recipe-title{
  font-family:'Playfair Display', serif;
  font-weight:700;
  font-size:2.4rem;
  line-height:1.15;
  margin:0 0 14px 0;
  color:var(--ink);
}
.recipe-desc{
  font-size:1.1rem;
  color:var(--ink-soft);
  font-weight:500;
  line-height:1.65;
  margin:0 0 28px 0;
  max-width:52ch;
}

.recipe-stats{
  display:flex;
  gap:28px;
  margin-bottom:36px;
  padding-bottom:28px;
  border-bottom:2px dashed var(--beige-deep);
}
.stat .num{
  font-family:'Playfair Display', serif;
  font-size:1.3rem;
  font-weight:600;
  color:var(--ink);
}
.stat .label{
  font-size:0.82rem;
  color:var(--ink-soft);
  font-weight:500;
}

.section-heading{
  font-family:'Playfair Display', serif;
  font-weight:600;
  font-style:italic;
  font-size:1.2rem;
  margin:0 0 14px 0;
  color:var(--basil);
}

.ingredients{
  list-style:none;
  padding:0;
  margin:0 0 36px 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 24px;
}
.ingredients li{
  font-size:1.02rem;
  font-weight:500;
  color:var(--ink);
  padding:7px 0;
  border-bottom:1px dashed var(--line);
  display:flex;
  justify-content:space-between;
  gap:12px;
}
.ingredients li span:last-child{
  color:var(--ink-soft);
  font-weight:500;
  white-space:nowrap;
}

.steps{
  list-style:none;
  padding:0;
  margin:0;
  counter-reset:step;
}
.steps li{
  counter-increment:step;
  position:relative;
  padding:0 0 22px 40px;
  font-size:1.05rem;
  font-weight:500;
  line-height:1.65;
  color:var(--ink);
}
.steps li::before{
  content:counter(step);
  position:absolute;
  left:0;
  top:1px;
  width:24px;
  height:24px;
  border-radius:50%;
  border:2px solid var(--aubergine);
  color:var(--aubergine);
  font-family:'Playfair Display', serif;
  font-size:0.8rem;
  display:flex;
  align-items:center;
  justify-content:center;
}

@media (max-width: 760px){
  .wrap{flex-direction:column;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);}
  .main{padding:36px 24px;}
  .ingredients{grid-template-columns:1fr;}
  .recipe-title{font-size:1.9rem;}
}
</style>
</head>

let currentMeal = "breakfast";
let currentIndex = 0;

function renderList(){
  const listEl = document.getElementById('optionList');
  listEl.innerHTML = '';
  DATA[currentMeal].forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'option-item' + (i === currentIndex ? ' selected' : '');
    li.innerHTML = `<div class="name">${item.name}</div><div class="meta">${item.time} · serves ${item.serves}</div>`;
    li.addEventListener('click', () => {
      currentIndex = i;
      renderList();
      renderRecipe();
    });
    listEl.appendChild(li);
  });
}

function renderRecipe(){
  const item = DATA[currentMeal][currentIndex];
  const card = document.getElementById('recipeCard');
  const ingredientsHtml = item.ingredients.map(([n, a]) => `<li><span>${n}</span><span>${a}</span></li>`).join('');
  const stepsHtml = item.steps.map(s => `<li>${s}</li>`).join('');
  card.innerHTML = `
    <p class="recipe-kicker">${currentMeal.charAt(0).toUpperCase() + currentMeal.slice(1)}</p>
    <h1 class="recipe-title">${item.name}</h1>
    <p class="recipe-desc">${item.desc}</p>
    <div class="recipe-stats">
      <div class="stat"><div class="num">⏱️ ${item.time}</div><div class="label">time</div></div>
      <div class="stat"><div class="num">🍽️ ${item.serves}</div><div class="label">serves</div></div>
    </div>
    <h2 class="section-heading">🥕 Ingredients</h2>
    <ul class="ingredients">${ingredientsHtml}</ul>
    <h2 class="section-heading">👨‍🍳 Method</h2>
    <ol class="steps">${stepsHtml}</ol>
  `;
}

document.querySelectorAll('.meal-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.meal-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMeal = btn.dataset.meal;
    currentIndex = 0;
    renderList();
    renderRecipe();
  });
});

renderList();
renderRecipe();
</script>
